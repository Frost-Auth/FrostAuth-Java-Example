name: Java SDK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Verify JAR contents
        shell: bash
        run: |
          jars=(target/*.jar)
          test "${#jars[@]}" -eq 1
          test -f "${jars[0]}"
          jar tf "${jars[0]}" > target/jar-entries.txt
          grep -Fx 'io/frostauth/FrostAuth.class' target/jar-entries.txt
          grep -Fx 'io/frostauth/Example.class' target/jar-entries.txt
          grep -Fx 'META-INF/LICENSE' target/jar-entries.txt
